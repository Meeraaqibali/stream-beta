name: Build Beta APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool m4 pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libreadline-dev libsqlite3-dev libgdbm-dev libbz2-dev liblzma-dev tk-dev uuid-dev libltdl-dev

      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug
        id: buildozer

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stream-beta-apk
          path: bin/*.apk
